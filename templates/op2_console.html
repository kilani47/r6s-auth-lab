{% extends "base.html" %}
{% block title %}Operator Console // ACCESS GRANTED{% endblock %}
{% block body %}
  <div class="fixed inset-0 scanlines pointer-events-none"></div>
  <div class="min-h-screen flex items-center justify-center p-6 overflow-hidden">
    <div class="text-center max-w-[680px]">
      <!-- real Sledge hammer GIF; falls back to the operator icon if absent -->
      <img src="/static/img/victory-op2.gif" alt="Sledge breaches"
           onerror="this.onerror=null;this.src='/static/img/ops/sledge.svg';this.className='w-[190px] h-[190px] mx-auto drop-shadow-[0_0_30px_rgba(63,185,80,.55)] animate-slam';"
           class="w-[560px] max-w-[94vw] h-auto mx-auto rounded-xl border border-win/40 shadow-[0_0_60px_rgba(63,185,80,.4)] animate-slam">
      <div class="mt-3 text-4xl sm:text-5xl font-display font-bold tracking-[.35em] text-white text-glow-win animate-rise-1">BARRICADE DOWN</div>
      <div class="text-win tracking-[.22em] text-[13px] mt-1 animate-rise-2">SLEDGE CRACKED {{ user|upper }} · OPERATION 02 CLEARED</div>
      <div class="inline-block mt-5 px-5 py-3.5 hud-frame hud-frame-win border border-win/40 bg-win/[.06] max-w-[92vw] animate-rise-3">
        <div class="text-[10px] tracking-[.25em] text-dim uppercase">Operation 02 Token — Operation 03 is now unlocked at Command</div>
        <code class="block mt-1.5 text-base sm:text-xl text-[#eafff0] font-bold word-break font-mono">{{ flag }}</code>
      </div>
      <div class="mt-6 animate-rise-4">
        <a href="/" class="inline-block px-6 py-3 hud-btn font-display font-extrabold tracking-wide uppercase text-[13px] bg-win text-[#04120a]">▶ Return to Command</a>
      </div>
    </div>
  </div>
{% endblock %}
